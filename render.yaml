services:
  - type: web
    name: jagan-fertilizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_products.py && waitress-serve --listen=0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
